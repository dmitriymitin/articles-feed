server {
	root /var/www/articles-feed/html;

	index index.html index.htm index.nginx-debian.html;

        server_name dm-articles-feed.ru www.dm-articles-feed.ru;

	location / {
		try_files $uri $uri/ /index.html;
	}

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dm-articles-feed.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dm-articles-feed.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.dm-articles-feed.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = dm-articles-feed.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


	listen 80;
	listen [::]:80;

    server_name dm-articles-feed.ru www.dm-articles-feed.ru;
    return 404; # managed by Certbot
}