server {

    root /var/www/articles-feed/html;

    index index.html index.htm index.nginx-debian.html;

    server_name dm-articles-feed.ru www.dm-articles-feed.ru;

    location /api/ {
        proxy_pass https://dm-articles-feed.ru:8443/;

        proxy_ssl_server_name on;
        proxy_ssl_name dm-articles-feed.ru;

        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dm-articles-feed.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dm-articles-feed.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.dm-articles-feed.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = dm-articles-feed.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name dm-articles-feed.ru www.dm-articles-feed.ru;
    return 404; # managed by Certbot
}